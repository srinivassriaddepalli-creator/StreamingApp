apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: streaming-mongodb-persistent
  namespace: streamingapp
spec:
  serviceName: streaming-mongodb-persistent
  replicas: 1
  selector:
    matchLabels:
      app: streaming-mongodb-persistent
  template:
    metadata:
      labels:
        app: streaming-mongodb-persistent
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: streamingapp-gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-mongodb-persistent
  namespace: streamingapp
spec:
  clusterIP: None
  selector:
    app: streaming-mongodb-persistent
  ports:
    - port: 27017
      targetPort: 27017
