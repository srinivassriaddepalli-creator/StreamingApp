server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://streaming-auth:3001;
    }

    location /api/streaming/ {
        proxy_pass http://streaming-stream:3002;
        proxy_buffering off;
    }

    location /api/admin/ {
        proxy_pass http://streaming-admin:3003;
    }

    location /api/chat/ {
        proxy_pass http://streaming-chat:3004;
    }

    location /socket.io/ {
        proxy_pass http://streaming-chat:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
